name: bot
on:
  schedule:
    - cron: "45 14,19,20 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bot
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: node bot.mjs
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          AUTO: ${{ vars.AUTO }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: Save IV history
        run: |
          git config user.name "options-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/iv.json
          git diff --cached --quiet || (git commit -m "Update IV history" && git pull --rebase -q && git push)
